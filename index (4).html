<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Len 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#10283a;--moon:#f4ead0;--amber:#ffd27a;--petal:#f3a9bb;--plum:#1c1430}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font-family:"Quicksand",system-ui,sans-serif;color:var(--moon)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.veil{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(10,22,34,.55);backdrop-filter:blur(3px);z-index:5}
.veil.on{display:flex}
.card{max-width:420px;width:100%;background:var(--moon);color:var(--plum);border-radius:28px 28px 28px 6px;padding:28px 26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.card h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;font-size:2.4rem;line-height:1.1;margin:0 0 12px}
.note{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:400;font-size:1.35rem;line-height:1.45;margin:6px 0 20px}
.card p{margin:0 0 12px;line-height:1.55;font-size:1.02rem;font-weight:500}
.count{font-size:.85rem!important;opacity:.6;margin:0!important}
.hint{opacity:.7}
.firma{font-family:"Fraunces",Georgia,serif;font-style:italic;text-align:right;margin:4px 0 0!important}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:2px solid var(--plum);border-radius:999px;padding:11px 22px;background:var(--plum);color:var(--moon);cursor:pointer}
button.ghost{background:transparent;color:var(--plum)}
button:focus-visible{outline:3px solid #d1558a;outline-offset:3px}
#reply{display:none}
#mute{position:fixed;top:14px;left:14px;z-index:6;width:42px;height:42px;padding:0;border:0;font-size:1.1rem;background:rgba(244,234,208,.18);backdrop-filter:blur(4px);color:var(--moon)}
</style>
</head>
<body>
<canvas id="c" aria-label="Un gato en un jardín de noche atrapando estrellas"></canvas>
<button id="mute" aria-label="Silenciar música">🔊</button>

<div class="veil on" id="intro"><div class="card">
  <h1 id="tIntro">Para Len</h1>
  <p>Esta noche caen estrellas en el jardín. Ayuda al gato a atraparlas y arma el cielo.</p>
  <p class="hint">Arrastra el dedo, o usa ← →, para mover al gato. Tiene música de ambiente 🎵 (puedes silenciarla arriba a la izquierda).</p>
  <button id="go">Jugar</button>
</div></div>

<div class="veil" id="noteV"><div class="card">
  <p class="count" id="cnt"></p>
  <p class="note" id="txt"></p>
  <button id="nx">Seguir</button>
</div></div>

<div class="veil" id="endV"><div class="card">
  <p class="note" id="q"></p>
  <div class="row" id="opts">
    <button id="yes"></button>
    <button id="maybe" class="ghost"></button>
  </div>
  <p class="note" id="reply"></p>
  <p class="firma" id="firma"></p>
</div></div>

<script>
/* ====== EDITA AQUÍ: textos del juego ====== */
const CONFIG = {
  nombre: "Len",
  firma: "— Dan",
  notas: [
    "Todo empezó jugando, y mira: ahora te estoy haciendo un juego a ti.",
    "Dicen que los gatos eligen a su persona. No sé quién eligió a quién, pero me quedo.",
    "Escribo tu nombre y se me sube una sonrisa sin permiso. Raro, ¿no?",
    "Tú sueltas una frase bonita como si nada, y yo me quedo medio minuto sin saber qué responder.",
    "Si me preguntan cuál es mi parte favorita del día, hay una respuesta que empieza con L.",
    "No tengo prisa. Solo no quiero que dejes de decirme cosas lindas.",
    "Me gusta lo que somos. Y me da curiosidad, con calma, lo que puede venir."
  ],
  pregunta: "Una pregunta chiquita, sin presión: ¿seguimos así, cerquita y a nuestro ritmo?",
  si: "Me gusta cómo suena",
  siRespuesta: "Entonces trato hecho. Cerquita, a nuestro ritmo, y con muchas estrellas por atrapar. 🐾",
  quizas: "Déjame pensarlo",
  quizasRespuesta: "Claro, sin prisa. El gato y yo esperamos aquí. 🐾"
};
/* ========================================= */

const C = CONFIG, N = C.notas.length;
const $ = id => document.getElementById(id);
const cv = $('c'), cx = cv.getContext('2d');
let W, H, S, G, time = 0, state = 'intro', got = 0, star = null, spawn = .6, finishT = 0, fly = null, target = null, endShown = false;
const cat = { x: 0, dir: 1, t: 0, moving: false };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Contorno de la cabeza de gato: una estrella por punto */
const PTS = [[-1,-1],[0,-.55],[1,-1],[1.1,.2],[.5,.95],[-.5,.95],[-1.1,.2]];

const bg = Array.from({length: 80}, () => ({x: Math.random(), y: Math.random() * .62, r: rand(.5, 1.6), p: rand(0, 6)}));
const trees = Array.from({length: 11}, (_, i) => ({x: i / 10 + rand(-.03, .03), h: rand(.1, .2), w: rand(.04, .07)}));
const flowers = Array.from({length: 46}, () => ({x: Math.random(), y: Math.random(), c: ['#f3a9bb', '#f4ead0', '#ffd27a'][Math.floor(Math.random() * 3)], s: rand(2.5, 4.5)}));
const flies = Array.from({length: 14}, () => ({x: Math.random(), y: rand(.45, .85), p: rand(0, 6), sp: rand(.3, .8)}));

function size() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
  S = clamp(Math.min(W, H) / 560, .75, 1.4);
  G = H * .86;
  cat.x = clamp(cat.x || W / 2, 30 * S, W - 30 * S);
  buildStatic();
}
addEventListener('resize', size); size();

function cc() { const R = Math.min(W, H) * .12; return {x: W / 2, y: Math.max(R * 1.4, H * .2), R}; }
function slot(i) { const c = cc(); return {x: c.x + PTS[i][0] * c.R * .9, y: c.y + PTS[i][1] * c.R * .8}; }

/* ---------- entrada ---------- */
addEventListener('pointerdown', e => { if (state === 'play') target = e.clientX; });
addEventListener('pointermove', e => { if (state === 'play' && (e.buttons || e.pointerType === 'mouse')) target = e.clientX; });
const keys = {};
addEventListener('keydown', e => { keys[e.key] = 1; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key] = 0; });

$('tIntro').textContent = 'Para ' + C.nombre;
$('go').onclick = () => { $('intro').classList.remove('on'); state = 'play'; cat.x = W / 2; startAudio(); };
$('nx').onclick = () => {
  $('noteV').classList.remove('on');
  if (got === N) { state = 'finish'; finishT = 0; fanfare(); } else { state = 'play'; spawn = .6; }
};
$('q').textContent = C.pregunta;
$('yes').textContent = C.si; $('maybe').textContent = C.quizas;
$('firma').textContent = C.firma;
function answer(txt) {
  $('opts').style.display = 'none';
  const r = $('reply'); r.textContent = txt; r.style.display = 'block';
  $('q').style.display = 'none';
}
$('yes').onclick = () => answer(C.siRespuesta);
$('maybe').onclick = () => answer(C.quizasRespuesta);

function showNote() {
  state = 'note';
  $('cnt').textContent = got + ' de ' + N;
  $('txt').textContent = C.notas[got - 1];
  $('nx').textContent = got === N ? 'Mirar el cielo' : 'Seguir';
  $('noteV').classList.add('on');
  $('nx').focus({preventScroll: true});
}

/* ---------- lógica ---------- */
function update(dt) {
  if (state === 'play') {
    const sp = 250 * S; let move = 0;
    if (keys.ArrowLeft || keys.a || keys.A) target = cat.x - 140;
    if (keys.ArrowRight || keys.d || keys.D) target = cat.x + 140;
    if (target != null) {
      const d = target - cat.x;
      if (Math.abs(d) > 4) { move = Math.sign(d); cat.x += move * Math.min(Math.abs(d), sp * dt); cat.dir = move; }
    }
    cat.x = clamp(cat.x, 30 * S, W - 30 * S);
    cat.moving = !!move; if (move) cat.t += dt * 10;

    if (!star) {
      spawn -= dt;
      if (spawn <= 0) star = {x: rand(.12 * W, .88 * W), y: -20, a: 1, fade: 0};
    } else if (!star.fade) {
      star.y += (70 + got * 6) * S * dt;
      star.x += Math.sin(time * 2 + got) * 12 * dt;
      const hx = cat.x + cat.dir * 24 * S, hy = G - 40 * S;
      if (Math.hypot(star.x - hx, star.y - hy) < 46 * S) {
        const s = slot(got);
        fly = {t: 0, x0: star.x, y0: star.y, x1: s.x, y1: s.y};
        state = 'fly'; chime(); burst(star.x, star.y);
      } else if (star.y > G) star.fade = 1;
    } else {
      star.a -= dt;
      if (star.a <= 0) { star = null; spawn = .8; }
    }
  } else if (state === 'fly') {
    fly.t += dt / .8;
    const k = Math.min(1, fly.t), e = 1 - Math.pow(1 - k, 3);
    star.x = fly.x0 + (fly.x1 - fly.x0) * e;
    star.y = fly.y0 + (fly.y1 - fly.y0) * e;
    if (k >= 1) { got++; star = null; showNote(); }
  } else if (state === 'finish') {
    finishT += dt;
    if (finishT > 3.4 && !endShown) {
      endShown = true; state = 'end';
      $('endV').classList.add('on'); $('yes').focus({preventScroll: true});
    }
  }
}

/* ---------- dibujo ---------- */
function drawStar(x, y, r, glow) {
  if (glow) {
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 3.2);
    g.addColorStop(0, 'rgba(255,210,122,.55)'); g.addColorStop(1, 'rgba(255,210,122,0)');
    cx.fillStyle = g; cx.fillRect(x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
  }
  cx.fillStyle = glow ? '#ffd27a' : '#f4ead0';
  cx.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? r * .4 : r;
    cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  cx.closePath(); cx.fill();
}

var sc, vg, DT = 0, shoot = null, parts = [];
var clouds = Array.from({length: 4}, (_, i) => ({x: Math.random(), y: .05 + i * .07, s: rand(6, 14), w: rand(120, 220)}));
var petals = Array.from({length: 26}, () => ({x: Math.random(), y: Math.random(), p: rand(0, 6), s: rand(.6, 1.2)}));
var blades = Array.from({length: 90}, () => ({x: Math.random(), h: rand(8, 20), p: rand(0, 6)}));

function ridge(x, col, base, amp, f, ph) {
  x.fillStyle = col; x.beginPath(); x.moveTo(0, G);
  for (let i = 0; i <= W; i += 12) x.lineTo(i, base - amp * (.55 * Math.sin(i / W * f + ph) + .3 * Math.sin(i / W * f * 2.3 + ph * 2) + .15 * Math.sin(i / W * f * 5 + ph)));
  x.lineTo(W, G); x.closePath(); x.fill();
}

function buildStatic() {
  const d = Math.min(devicePixelRatio || 1, 2);
  sc = document.createElement('canvas'); sc.width = W * d; sc.height = H * d;
  const x = sc.getContext('2d'); x.scale(d, d);
  let g = x.createLinearGradient(0, 0, 0, G);
  g.addColorStop(0, '#070f23'); g.addColorStop(.5, '#16355c'); g.addColorStop(.85, '#4b628a'); g.addColorStop(1, '#b98aa3');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  [[.2, .28, .4, '243,169,187', .14], [.7, .4, .45, '120,200,190', .11], [.45, .15, .35, '160,140,230', .1]].forEach(([a, b, r, c, o]) => {
    const q = x.createRadialGradient(a * W, b * G, 0, a * W, b * G, r * W);
    q.addColorStop(0, `rgba(${c},${o})`); q.addColorStop(1, `rgba(${c},0)`);
    x.fillStyle = q; x.fillRect(0, 0, W, G);
  });
  const mx = W * .82, my = H * .14, mr = 34 * S;
  x.fillStyle = '#f6edd2'; x.beginPath(); x.arc(mx, my, mr, 0, 7); x.fill();
  x.fillStyle = 'rgba(190,170,140,.28)';
  [[-.3, -.2, .22], [.25, .1, .16], [-.1, .35, .13], [.35, -.35, .1], [-.4, .25, .09]].forEach(([a, b, r]) => { x.beginPath(); x.arc(mx + a * mr, my + b * mr, r * mr, 0, 7); x.fill(); });
  ridge(x, '#2a4770', G - H * .2, H * .12, 5, 1);
  ridge(x, '#213c5e', G - H * .14, H * .1, 6, 3);
  const mist = x.createLinearGradient(0, G - H * .18, 0, G - H * .04);
  mist.addColorStop(0, 'rgba(185,200,225,0)'); mist.addColorStop(1, 'rgba(185,200,225,.22)');
  x.fillStyle = mist; x.fillRect(0, G - H * .18, W, H * .14);
  ridge(x, '#1a3552', G - H * .09, H * .07, 7, 5);
  ridge(x, '#173d44', G - H * .04, H * .04, 9, 2);
  const ly = G - H * .022, lk = x.createLinearGradient(0, ly - H * .025, 0, ly + H * .025);
  lk.addColorStop(0, '#2a4f78'); lk.addColorStop(1, '#14304a');
  x.fillStyle = lk; x.beginPath(); x.ellipse(W * .64, ly, W * .33, H * .025, 0, 0, 7); x.fill();
  trees.forEach(t => {
    if (t.x < .2 || (t.x > .36 && t.x < .94)) return;
    const px = t.x * W, h = t.h * H * .9, w = t.w * W + 14, b = G - H * .012;
    x.fillStyle = '#0f2b2d';
    for (let k = 0; k < 3; k++) { const yy = b - h * k * .28, ww = w * (1 - k * .22); x.beginPath(); x.moveTo(px - ww / 2, yy); x.lineTo(px, yy - h * .5); x.lineTo(px + ww / 2, yy); x.fill(); }
    x.fillRect(px - 2, b, 4, H * .012);
  });
  /* cerezo en flor */
  const bx = W * .11, bb = G - H * .005;
  x.strokeStyle = '#2b1d2f'; x.lineCap = 'round'; x.lineWidth = 10 * S;
  x.beginPath(); x.moveTo(bx, bb); x.quadraticCurveTo(bx - 8 * S, bb - H * .12, bx + 6 * S, bb - H * .2); x.stroke();
  x.lineWidth = 5 * S; x.beginPath(); x.moveTo(bx, bb - H * .1); x.lineTo(bx + H * .07, bb - H * .18); x.moveTo(bx, bb - H * .12); x.lineTo(bx - H * .07, bb - H * .19); x.stroke();
  for (let i = 0; i < 46; i++) {
    const a = i * 2.4, r = Math.sqrt(i / 46) * H * .11;
    x.fillStyle = ['#e993ab', '#f3a9bb', '#f7c6d3'][i % 3]; x.globalAlpha = .9;
    x.beginPath(); x.arc(bx + Math.cos(a) * r * 1.3, bb - H * .22 + Math.sin(a) * r * .8, (9 + i % 4 * 3) * S, 0, 7); x.fill();
  }
  x.globalAlpha = 1;
  const gg = x.createLinearGradient(0, G - 4, 0, H);
  gg.addColorStop(0, '#2d5b45'); gg.addColorStop(1, '#12302a');
  x.fillStyle = gg; x.fillRect(0, G - 4, W, H - G + 4);
  x.fillStyle = 'rgba(255,255,255,.05)';
  for (let i = 0; i < 60; i++) { x.beginPath(); x.arc(Math.random() * W, G + Math.random() * (H - G), rand(1, 3), 0, 7); x.fill(); }
  vg = document.createElement('canvas'); vg.width = W; vg.height = H;
  const v = vg.getContext('2d'), r = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  r.addColorStop(0, 'rgba(5,10,25,0)'); r.addColorStop(1, 'rgba(5,10,25,.55)');
  v.fillStyle = r; v.fillRect(0, 0, W, H);
}

function burst(x, y) {
  for (let i = 0; i < 18; i++) { const a = rand(0, 6.3), sp = rand(40, 140); parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, l: rand(.6, 1.1), r: rand(1.2, 3), c: i % 3 ? '#ffd27a' : '#f3a9bb'}); }
}

function scene() {
  cx.drawImage(sc, 0, 0, W, H);
  bg.forEach(s => {
    cx.globalAlpha = .35 + .65 * Math.abs(Math.sin(time * .8 + s.p));
    cx.fillStyle = '#f4ead0'; cx.beginPath(); cx.arc(s.x * W, s.y * G, s.r, 0, 7); cx.fill();
  });
  cx.globalAlpha = 1;
  if (!shoot && Math.random() < DT / 9) shoot = {x: rand(.3, .9) * W, y: rand(.03, .2) * H, l: 0};
  if (shoot) {
    shoot.l += DT / .9;
    const k = shoot.l, x = shoot.x - k * 220 * S, y = shoot.y + k * 110 * S;
    const g = cx.createLinearGradient(x, y, x + 70 * S, y - 35 * S);
    g.addColorStop(0, 'rgba(255,255,255,' + clamp(1 - k, 0, 1) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 70 * S, y - 35 * S); cx.stroke();
    if (k >= 1) shoot = null;
  }
  const mx = W * .82, my = H * .14, mr = 34 * S, pulse = 1 + .06 * Math.sin(time * .9);
  const mg = cx.createRadialGradient(mx, my, mr * .8, mx, my, mr * 4.2 * pulse);
  mg.addColorStop(0, 'rgba(246,237,210,.38)'); mg.addColorStop(1, 'rgba(246,237,210,0)');
  cx.fillStyle = mg; cx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  cx.fillStyle = 'rgba(200,215,240,.13)';
  clouds.forEach(c => {
    const x = ((c.x * W + time * c.s) % (W + 400)) - 200, y = c.y * H, w = c.w * S;
    [[0, 0, 1, .22], [-.3, .08, .7, .17], [.32, .06, .75, .18]].forEach(([a, b, k, h]) => { cx.beginPath(); cx.ellipse(x + a * w, y + b * w, w * k * .5, w * h * .5, 0, 0, 7); cx.fill(); });
  });
  /* reflejo en el lago */
  const ly = G - H * .022;
  cx.save(); cx.beginPath(); cx.ellipse(W * .64, ly, W * .33, H * .025, 0, 0, 7); cx.clip();
  for (let k = 0; k < 9; k++) {
    const yy = ly - H * .02 + k * H * .005, w = (14 - Math.abs(k - 4) * 1.4) * S * (1 + .3 * Math.sin(time * 1.6 + k));
    cx.fillStyle = 'rgba(246,237,210,' + (.35 - k * .02) + ')'; cx.fillRect(mx - w / 2 + Math.sin(time * 1.3 + k) * 3, yy, w, 1.6);
  }
  cx.restore();
  /* pasto */
  cx.lineCap = 'round';
  blades.forEach(b => {
    const x = b.x * W, h = b.h * S, sw = Math.sin(time * 1.4 + b.p + x * .01) * 4 * S;
    cx.strokeStyle = b.p > 3 ? '#3f7a58' : '#2c6049'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(x, G + 2); cx.quadraticCurveTo(x + sw * .4, G - h * .5, x + sw, G - h); cx.stroke();
  });
  flowers.forEach(f => {
    const sw = Math.sin(time * 1.2 + f.x * 9) * 2, x = f.x * W + sw, y = G + 6 + f.y * (H - G - 10), s = f.s * S * 1.1;
    cx.strokeStyle = '#3f7a62'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(f.x * W, y + s * 3); cx.lineTo(x, y); cx.stroke();
    const gl = cx.createRadialGradient(x, y, 0, x, y, s * 3.2); gl.addColorStop(0, f.c + '55'); gl.addColorStop(1, f.c + '00');
    cx.fillStyle = gl; cx.fillRect(x - s * 3.2, y - s * 3.2, s * 6.4, s * 6.4);
    cx.fillStyle = f.c;
    for (let k = 0; k < 5; k++) { const a = k * 1.2566 + f.x * 5; cx.beginPath(); cx.arc(x + Math.cos(a) * s * .8, y + Math.sin(a) * s * .8, s * .62, 0, 7); cx.fill(); }
    cx.fillStyle = '#ffb347'; cx.beginPath(); cx.arc(x, y, s * .5, 0, 7); cx.fill();
  });
  flies.forEach(f => {
    const x = f.x * W + Math.sin(time * f.sp + f.p) * 30, y = f.y * G + Math.cos(time * f.sp * 1.3 + f.p) * 14, a = .3 + .6 * Math.abs(Math.sin(time * 1.5 + f.p));
    const q = cx.createRadialGradient(x, y, 0, x, y, 9); q.addColorStop(0, 'rgba(255,225,140,' + a + ')'); q.addColorStop(1, 'rgba(255,225,140,0)');
    cx.fillStyle = q; cx.fillRect(x - 9, y - 9, 18, 18);
  });
  petals.forEach(p => {
    const x = (p.x * W * .5 + time * 16 * p.s + Math.sin(time * .8 + p.p) * 22) % (W * .95), y = (p.y * G + time * 20 * p.s) % G;
    cx.fillStyle = 'rgba(243,169,187,.8)'; cx.beginPath(); cx.ellipse(x, y, 3.2 * S, 1.8 * S, time * p.s + p.p, 0, 7); cx.fill();
  });
  parts = parts.filter(p => (p.l -= DT) > 0);
  parts.forEach(p => { p.x += p.vx * DT; p.y += p.vy * DT; p.vy += 80 * DT; cx.globalAlpha = clamp(p.l, 0, 1); cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); });
  cx.globalAlpha = 1;
}

function drawConst() {
  const c = cc();
  if (state === 'finish' || state === 'end') {
    const k = clamp(finishT / 2.2, 0, 1);
    const g = cx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.R * 2.4);
    g.addColorStop(0, 'rgba(255,210,122,' + (.28 * k) + ')'); g.addColorStop(1, 'rgba(255,210,122,0)');
    cx.fillStyle = g; cx.fillRect(c.x - c.R * 3, c.y - c.R * 3, c.R * 6, c.R * 6);
  }
  cx.strokeStyle = 'rgba(255,210,122,.75)'; cx.lineWidth = 1.6; cx.lineCap = 'round';
  cx.beginPath();
  for (let i = 0; i < got; i++) { const s = slot(i); i ? cx.lineTo(s.x, s.y) : cx.moveTo(s.x, s.y); }
  cx.stroke();
  if (got === N && (state === 'finish' || state === 'end')) {
    const k = clamp(finishT / 1.2, 0, 1), a = slot(N - 1), b = slot(0);
    cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k); cx.stroke();
    const f = clamp((finishT - 1.2) / 1.2, 0, 1);
    if (f > 0) {
      cx.globalAlpha = f;
      cx.fillStyle = '#ffd27a';
      [-.38, .38].forEach(o => { cx.beginPath(); cx.arc(c.x + o * c.R, c.y + c.R * .1, c.R * .07, 0, 7); cx.fill(); });
      cx.fillStyle = '#f3a9bb'; cx.beginPath();
      cx.moveTo(c.x - c.R * .09, c.y + c.R * .32); cx.lineTo(c.x + c.R * .09, c.y + c.R * .32); cx.lineTo(c.x, c.y + c.R * .44); cx.fill();
      cx.globalAlpha = 1;
    }
  }
  for (let i = 0; i < N; i++) {
    const s = slot(i), on = i < got;
    cx.globalAlpha = on ? 1 : .25;
    drawStar(s.x, s.y, on ? 7 * S : 3.5 * S, on);
  }
  cx.globalAlpha = 1;
}

function drawFalling() {
  if (!star) return;
  cx.globalAlpha = clamp(star.a, 0, 1);
  if (state === 'play' && !star.fade) {
    cx.strokeStyle = 'rgba(255,210,122,.35)'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(star.x, star.y - 38 * S); cx.lineTo(star.x, star.y); cx.stroke();
  }
  drawStar(star.x, star.y, 10 * S * (1 + .12 * Math.sin(time * 6)), true);
  cx.globalAlpha = 1;
}

function drawCat() {
  const s = S, mv = cat.moving ? 1 : 0, ph = cat.t;
  const hop = state === 'fly' && fly ? Math.sin(Math.min(1, fly.t * 2.2) * Math.PI) * 26 : 0;
  const br = Math.sin(time * 2) * 1.2 * (1 - mv), bob = Math.abs(Math.sin(ph)) * 2.2 * mv;
  const up = state === 'play' && star && !star.fade && star.y < G - 120;
  cx.save(); cx.translate(cat.x, G - hop * s); cx.scale(cat.dir * s, s);
  cx.fillStyle = 'rgba(0,0,0,' + (.28 - hop * .006) + ')'; cx.beginPath(); cx.ellipse(0, 2 + hop, 30 - hop * .3, 5, 0, 0, 7); cx.fill();
  cx.lineCap = cx.lineJoin = 'round';
  const leg = (x, off, col) => {
    const sw = Math.sin(ph + off) * .75 * mv, lift = Math.max(0, Math.cos(ph + off)) * 5 * mv;
    cx.strokeStyle = col; cx.lineWidth = 6; cx.beginPath();
    cx.moveTo(x, -22 - bob); cx.lineTo(x + Math.sin(sw) * 7, -11 - lift * .5); cx.lineTo(x + Math.sin(sw) * 13, -2 - lift); cx.stroke();
  };
  leg(-16, 0, '#2c2245'); leg(12, Math.PI, '#2c2245');
  cx.strokeStyle = '#1c1430'; cx.lineWidth = 7; cx.beginPath(); cx.moveTo(-22, -28 - bob);
  for (let i = 1; i <= 7; i++) { const a = i / 7; cx.lineTo(-22 - a * 22 + Math.sin(time * 2.6 - a * 4) * 6 * a, -28 - bob - a * 36 + Math.sin(time * 2.2 - a * 3) * 4 * a); }
  cx.stroke();
  cx.fillStyle = '#1c1430'; cx.beginPath(); cx.ellipse(0, -27 - bob + br, 25 + mv * 1.5, 14, 0, 0, 7); cx.fill();
  cx.strokeStyle = 'rgba(244,234,208,.3)'; cx.lineWidth = 1.5; cx.beginPath(); cx.ellipse(0, -27 - bob + br, 24, 13.5, 0, 3.5, 5.9); cx.stroke();
  leg(-8, Math.PI, '#1c1430'); leg(20, 0, '#1c1430');
  cx.fillStyle = '#f3a9bb'; cx.beginPath(); cx.ellipse(16, -33 - bob + br, 3.6, 8, .25, 0, 7); cx.fill();
  cx.fillStyle = '#ffd27a'; cx.beginPath(); cx.arc(18, -26 - bob + br, 2.8, 0, 7); cx.fill();
  /* cabeza */
  cx.save(); cx.translate(25, -40 - bob + br * 1.2); cx.rotate(up ? -.38 : Math.sin(time * 1.5) * .04 - mv * .05);
  cx.fillStyle = '#1c1430'; cx.beginPath(); cx.arc(0, 0, 12.5, 0, 7); cx.fill();
  const tw = Math.sin(time * 7) * (Math.sin(time * .6) > .88 ? .3 : 0);
  cx.save(); cx.translate(-8, -8); cx.rotate(tw); cx.beginPath(); cx.moveTo(-3, 3); cx.lineTo(0, -15); cx.lineTo(9, 1); cx.fill(); cx.restore();
  cx.beginPath(); cx.moveTo(2, -10); cx.lineTo(10, -16); cx.lineTo(12, 0); cx.fill();
  cx.fillStyle = '#f3a9bb'; cx.beginPath(); cx.moveTo(-3, -6); cx.lineTo(-.5, -12); cx.lineTo(3, -7); cx.fill();
  const blink = (time % 4) < .12 ? .15 : 1;
  cx.fillStyle = '#ffd27a'; cx.beginPath(); cx.ellipse(5, -1.5, 2.7, 3.3 * blink, 0, 0, 7); cx.fill();
  cx.fillStyle = '#1c1430'; cx.beginPath(); cx.ellipse(5.4 + (up ? -.5 : .4), -1.5, .9, 2.8 * blink, 0, 0, 7); cx.fill();
  cx.fillStyle = '#f3a9bb'; cx.beginPath(); cx.moveTo(10, 3); cx.lineTo(13, 3); cx.lineTo(11.6, 5); cx.fill();
  cx.strokeStyle = 'rgba(244,234,208,.55)'; cx.lineWidth = .8; cx.beginPath();
  [[-2, 1.5], [0, 4]].forEach(([a, b]) => { cx.moveTo(11, 4); cx.lineTo(22, 4 + a + b * .4); });
  cx.stroke();
  cx.restore(); cx.restore();
}

/* ---------- música de ambiente (generada con Web Audio, sin archivos) ---------- */
var ac, master, bus, musicOn = true, nextNote = 0, nextChord = 0, nextCr = 0, chordI = 0;
const CH = [[110, 220, 261.63, 329.63, 392], [87.31, 174.61, 220, 261.63, 329.63], [130.81, 196, 261.63, 329.63, 392], [98, 196, 246.94, 293.66, 392]];
const PENT = [440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function tone(f, t, dur, type, g, att, dest) {
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.value = f;
  v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + att); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(v); v.connect(dest || bus); o.start(t); o.stop(t + dur + .1);
}
function startAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ac.createGain(); master.gain.setValueAtTime(0, ac.currentTime);
  master.gain.linearRampToValueAtTime(musicOn ? .55 : 0, ac.currentTime + 4); master.connect(ac.destination);
  const conv = ac.createConvolver(), n = ac.sampleRate * 3, buf = ac.createBuffer(2, n, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5); }
  conv.buffer = buf; const wet = ac.createGain(); wet.gain.value = .6; conv.connect(wet); wet.connect(master);
  bus = ac.createGain(); bus.connect(master); bus.connect(conv);
  const wb = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), wd = wb.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  const ws = ac.createBufferSource(); ws.buffer = wb; ws.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = .6;
  const wg = ac.createGain(); wg.gain.value = .025;
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .12; lg.gain.value = .015; lfo.connect(lg); lg.connect(wg.gain); lfo.start();
  ws.connect(bp); bp.connect(wg); wg.connect(master); ws.start();
  nextChord = nextNote = nextCr = ac.currentTime + .2;
  setInterval(tick, 300);
}
function tick() {
  if (!ac || ac.state !== 'running') return;
  const now = ac.currentTime;
  while (nextChord < now + .6) {
    CH[chordI % 4].forEach((f, i) => { tone(f, nextChord, 9, i ? 'triangle' : 'sine', i ? .03 : .05, 2.5); if (i) tone(f * 1.004, nextChord, 9, 'sine', .025, 2.5); });
    chordI++; nextChord += 8;
  }
  while (nextNote < now + .6) {
    const f = PENT[Math.floor(Math.random() * PENT.length)];
    tone(f, nextNote, 2.6, 'sine', .05, .01); tone(f * 2, nextNote, 1.2, 'sine', .012, .01);
    nextNote += rand(.6, 2.2);
  }
  while (nextCr < now + .6) { for (let k = 0; k < 3; k++) tone(4300, nextCr + k * .07, .05, 'sine', .006, .005, master); nextCr += rand(1.2, 3.5); }
}
function chime() { if (ac) [659.25, 783.99, 987.77].forEach((f, i) => tone(f, ac.currentTime + i * .09, 1.6, 'sine', .09, .01)); }
function fanfare() { if (ac) [440, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, ac.currentTime + i * .16, 3, 'sine', .08, .01)); }
$('mute').onclick = () => {
  musicOn = !musicOn; $('mute').textContent = musicOn ? '🔊' : '🔇';
  $('mute').setAttribute('aria-label', musicOn ? 'Silenciar música' : 'Activar música');
  if (ac) { master.gain.cancelScheduledValues(ac.currentTime); master.gain.linearRampToValueAtTime(musicOn ? .55 : 0, ac.currentTime + .4); }
};
document.addEventListener('visibilitychange', () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });

let last = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; time += dt; DT = dt;
  update(dt);
  if (state === 'fly' && star && Math.random() < .6) parts.push({x: star.x, y: star.y, vx: rand(-20, 20), vy: rand(-10, 20), l: .8, r: rand(1, 2.4), c: '#ffd27a'});
  scene(); drawConst(); drawFalling(); drawCat();
  cx.drawImage(vg, 0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
